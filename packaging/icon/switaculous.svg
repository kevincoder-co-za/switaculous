    <path transform="translate(770 236) scale(1.25)" d="M0,-100 C8,-30 30,-8 100,0 C30,8 8,30 0,100 C-8,30 -30,8 -100,0 C-30,-8 -8,-30 0,-100 Z"/>
    <path transform="translate(236 812) scale(0.5)" fill-opacity="0.9" d="M0,-100 C8,-30 30,-8 100,0 C30,8 8,30 0,100 C-8,30 -30,8 -100,0 C-30,-8 -8,-30 0,-100 Z"/>
